apiVersion: v1
kind: Namespace
metadata:
  name: auto-sre
  labels:
    app.kubernetes.io/part-of: auto-sre
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api
  namespace: auto-sre
  labels:
    app.kubernetes.io/name: demo-api
    app.kubernetes.io/part-of: auto-sre
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-api
        app.kubernetes.io/part-of: auto-sre
    spec:
      containers:
        - name: api
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: demo-api
  namespace: auto-sre
  labels:
    app.kubernetes.io/part-of: auto-sre
spec:
  selector:
    app.kubernetes.io/name: demo-api
  ports:
    - name: http
      port: 80
      targetPort: http
